[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "mai-solver"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "pybind11>=3.1.0",
    "pytest>=9.2.0",
    "scikit-build-core>=1.1.2",
]

[tool.scikit-build]
cmake.version = ">=3.18"
ninja.version = ">=1.10"
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
